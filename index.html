<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="favicon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>ChiNet Tms</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode') || 'light';
          var accent = localStorage.getItem('theme-accent') || 'blue';
          if (mode === 'dark' || mode === 'black') document.documentElement.classList.add('dark');
          if (mode === 'black') document.documentElement.classList.add('black');
          if (accent && accent !== 'blue') document.documentElement.classList.add('accent-' + accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
